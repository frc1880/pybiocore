#
# Use this configuration file to control what RobotPy packages are installed
# on your robot
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2027.0.0a8"

# Which optional robotpy components should be installed?
# -> equivalent to `pip install robotpy[extra1, ...]
components = [
    # "all",
    # "apriltag",
    "commands2",
    # "cscore",
    # "romi",
    # "sim",
    # "xrp",
]

# Other pip packages to install (including vendor packages)
requires = [
    "phoenix6~=26.70a2",
    # "photonlibpy",
    # "robotpy-rev",
]

[project]
name = "pybiocore"
version = "0.0.0"
description = "Python code for 2027 FRC - Biocore"
authors = [{ name = "The Warriors of East Harlem"}]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.15,<3.16"

dependencies = [
    "phoenix6~=26.70a2",
    "robotpy[commands2]==2027.0.0a8"
]
