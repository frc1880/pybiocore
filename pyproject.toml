#
# Use this configuration file to control what RobotPy packages are installed
# on your robot
#

[tool.mypy]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pyflakes
    "F",
    # flake8-bugbear
    "B",
    # isort
    "I",
    # pyupgrade
    "UP",
    # flake8-comprehensions
    "C4",
    # flake8-logging-format
    "G",
    # flake8-simplify
    "SIM",
    # flake8-print
    "T20",
    # perflint
    "PERF",
    # refurb
    "FURB",
    # ruff specific
    "RUF021", # parenthesise chained and/or
]
ignore = [
    "E501", # long lines
    "B905", # zip() without strict=
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "hypothesis>=6.112.1",
    "mypy>=1.19.1",
    "pytest>=9.1.1",
    "pytest-integration>=0.2.3",
]


[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2027.0.0a8"

# Which optional robotpy components should be installed?
# -> equivalent to `pip install robotpy[extra1, ...]
components = [
    # "all",
    # "apriltag",
    "commands2",
    # "cscore",
    # "romi",
    # "sim",
    # "xrp",
]

# Other pip packages to install (including vendor packages)
requires = [
    "phoenix6~=26.70a2",
    # "photonlibpy",
    # "robotpy-rev",
]

[project]
name = "pybiocore"
version = "0.0.0"
description = "Python code for 2027 FRC - Biocore"
authors = [{ name = "The Warriors of East Harlem"}]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.15,<3.16"

dependencies = [
    "phoenix6~=26.70a2",
    "robotpy[commands2]==2027.0.0a8"
]
